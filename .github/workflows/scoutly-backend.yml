name: Scoutly backend checks
on:
  push:
    paths: ['backend/**', '.github/workflows/scoutly-backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/scoutly-backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
