name: Scoutly landing B checks
on:
  push:
    paths: ['tools/fotografie-casa.html', 'tools/checklist-vendere-casa.html', 'assets/seller-guides/**', 'tests/seller-guides.test.mjs', 'index.html', 'assets/modern.css', 'tools/richiesta-inviata.html', 'tests/modern-design.test.mjs', 'tools/prima-di-pubblicare.html', 'tools/ristrutturare-o-vendere.html', 'tools/richiesta-ristrutturare-inviata.html', 'config/forms.json', 'assets/prima-di-pubblicare/**', 'tests/prima-di-pubblicare.test.mjs', 'tests/annuncio-email.test.mjs', 'tests/annuncio-upload.test.mjs', 'tests/submit-request.test.mjs', 'tests/public-intake.test.mjs', 'intake-python/**', '.github/workflows/scoutly-landing-b.yml']
  pull_request:
    paths: ['tools/fotografie-casa.html', 'tools/checklist-vendere-casa.html', 'assets/seller-guides/**', 'tests/seller-guides.test.mjs', 'index.html', 'assets/modern.css', 'tools/richiesta-inviata.html', 'tests/modern-design.test.mjs', 'tools/prima-di-pubblicare.html', 'tools/ristrutturare-o-vendere.html', 'tools/richiesta-ristrutturare-inviata.html', 'config/forms.json', 'assets/prima-di-pubblicare/**', 'tests/prima-di-pubblicare.test.mjs', 'tests/annuncio-email.test.mjs', 'tests/annuncio-upload.test.mjs', 'tests/submit-request.test.mjs', 'tests/public-intake.test.mjs', 'intake-python/**', '.github/workflows/scoutly-landing-b.yml']
permissions:
  contents: read
jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/seller-guides.test.mjs tests/modern-design.test.mjs tests/prima-di-pubblicare.test.mjs tests/annuncio-email.test.mjs tests/annuncio-upload.test.mjs tests/submit-request.test.mjs tests/public-intake.test.mjs
  python-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'
      - run: pip install -r intake-python/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: intake-python
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test intake-python/tests/test-page.test.mjs

